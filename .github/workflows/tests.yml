name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}; Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        laravel: ['8', '9', '10', '11', '12']
        exclude:
          - php: '7.4'
            laravel: '9'
          - php: '7.4'
            laravel: '10'
          - php: '7.4'
            laravel: '11'
          - php: '7.4'
            laravel: '12'
          - php: '8.0'
            laravel: '10'
          - php: '8.0'
            laravel: '11'
          - php: '8.0'
            laravel: '12'
          - php: '8.1'
            laravel: '11'
          - php: '8.1'
            laravel: '12'
          - php: '8.2'
            laravel: '8'
          - php: '8.3'
            laravel: '8'
          - php: '8.3'
            laravel: '9'
          - php: '8.4'
            laravel: '8'
          - php: '8.4'
            laravel: '9'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
        env:
          update: true

      - name: Setup Problem Matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Select Laravel 8
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require "laravel/framework:^8.83.29" "phpunit/phpunit:^9.6.22" --no-update --no-interaction
        if: "matrix.laravel == '8'"

      - name: Select Laravel 9
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require "laravel/framework:^9.52.18" "phpunit/phpunit:^9.6.22" --no-update --no-interaction
        if: "matrix.laravel == '9'"

      - name: Select Laravel 10
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require "laravel/framework:^10.48.25" "phpunit/phpunit:^10.5.41" --no-update --no-interaction
        if: "matrix.laravel == '10'"

      - name: Select Laravel 11
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require "laravel/framework:^11.37.0" "phpunit/phpunit:^10.5.41" --no-update --no-interaction
        if: "matrix.laravel == '11'"
      
      - name: Select Laravel 12
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer require "laravel/framework:^12.0.1" "phpunit/phpunit:^10.5.41" --no-update --no-interaction
        if: "matrix.laravel == '12'"

      - name: Install PHP Dependencies
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: composer update --no-interaction --no-progress

      - name: Execute PHPUnit
        run: vendor/bin/phpunit
